[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-gtm-state-engine"
version = "1.0.0"
description = "Deterministic GTM workflow state machine with PostgreSQL advisory locks."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["multi_agent_gtm_state_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
